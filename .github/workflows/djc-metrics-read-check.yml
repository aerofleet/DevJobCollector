name: DJC metrics authenticated read check
on:
  push:
    branches: [codex/member-mfa-alerting]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check existing E2E credential against metrics
        env:
          TOKEN: ${{ secrets.DJC_E2E_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then echo 'E2E credential unavailable'; exit 1; fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" https://djc-api.itsdev.kr/actuator/metrics/djc.member.login)
          echo "Authenticated metrics HTTP $status"
          test "$status" = 200
