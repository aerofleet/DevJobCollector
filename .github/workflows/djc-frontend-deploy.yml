name: Deploy DJC Frontend to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - "devjobcollector/frontend/**"
      - ".github/workflows/djc-frontend-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
    defaults:
      run:
        working-directory: ./devjobcollector/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: devjobcollector/frontend/package-lock.json

      - name: Verify Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || (echo "Missing CLOUDFLARE_API_TOKEN"; exit 1)
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || (echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1)

      - name: Verify frontend configuration
        run: |
          [ -n "$VITE_API_BASE_URL" ] || (echo "Missing repository variable: VITE_API_BASE_URL"; exit 1)
          case "$VITE_API_BASE_URL" in
            http://localhost:*|https://localhost:*)
              echo "VITE_API_BASE_URL must not point to localhost"
              exit 1
              ;;
          esac

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
