name: DJC Cloudflare security audit
on:
  push:
    branches: [codex/cloudflare-security-audit]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Cloudflare access and rate limit rules
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WAF_TOKEN }}
        run: python3 devjobcollector/ops/auth/audit_cloudflare_rate_limits.py
      - name: Apply login rate limit once
        if: github.event.head_commit.message == 'Apply DJC login IP limit'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WAF_TOKEN }}
        run: python3 devjobcollector/ops/auth/apply_cloudflare_login_limit.py
