name: Diagnose DJC Runtime Health

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install cloudflared client
        env:
          CLOUDFLARED_VERSION: 2026.5.1
          CLOUDFLARED_SHA256: 4274f6106efbe586e8e2127aba02798c55bcfd99a45d14f08779d6afc51e8752
        run: |
          set -euo pipefail
          package="cloudflared-linux-amd64.deb"
          curl --fail --location --retry 3 \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/${package}" \
            --output "$package"
          printf '%s  %s\n' "$CLOUDFLARED_SHA256" "$package" | sha256sum --check --strict
          sudo dpkg -i "$package"

      - name: Prepare diagnostic environment
        env:
          DB_SERVER_IP: ${{ secrets.DB_SERVER_IP }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          FLYWAY_USERNAME: ${{ secrets.FLYWAY_USERNAME }}
          FLYWAY_PASSWORD: ${{ secrets.FLYWAY_PASSWORD }}
          API_SERVICE_KEY: ${{ secrets.API_SERVICE_KEY }}
          AUTH_TOKEN_SECRET: ${{ secrets.AUTH_TOKEN_SECRET }}
          AUTH_FRONTEND_SUCCESS_URI: ${{ secrets.AUTH_FRONTEND_SUCCESS_URI }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          umask 077
          {
            printf '%s\n' 'SPRING_PROFILES_ACTIVE=prod'
            printf '%s\n' "SPRING_DATASOURCE_URL=jdbc:mysql://${DB_SERVER_IP}:3306/devjob?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true"
            printf '%s\n' "SPRING_DATASOURCE_USERNAME=$DB_USERNAME"
            printf '%s\n' "SPRING_DATASOURCE_PASSWORD=$DB_PASSWORD"
            printf '%s\n' "DB_PASSWORD=$DB_PASSWORD"
            printf '%s\n' "FLYWAY_USERNAME=$FLYWAY_USERNAME"
            printf '%s\n' "FLYWAY_PASSWORD=$FLYWAY_PASSWORD"
            printf '%s\n' "API_SERVICE_KEY=$API_SERVICE_KEY"
            printf '%s\n' "AUTH_TOKEN_SECRET=$AUTH_TOKEN_SECRET"
            printf '%s\n' "AUTH_FRONTEND_SUCCESS_URI=$AUTH_FRONTEND_SUCCESS_URI"
            printf '%s\n' "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID"
            printf '%s\n' "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET"
            printf '%s\n' "SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID"
            printf '%s\n' "SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET"
            printf '%s\n' 'ATS_COLLECTION_ENABLED=false'
            printf '%s\n' 'SARAMIN_COLLECTION_ENABLED=false'
            printf '%s\n' 'TOSS_COLLECTION_ENABLED=false'
            printf '%s\n' 'NAVER_COLLECTION_ENABLED=false'
            printf '%s\n' 'AUTH_SIGNUP_MAIL_ENABLED=false'
            printf '%s\n' 'AUTH_SIGNUP_TURNSTILE_ENABLED=false'
            printf '%s\n' 'MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS=always'
          } > diagnostic.env

      - name: Run isolated health diagnostic through Cloudflare Tunnel
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat > ~/.ssh/config <<EOF
          Host djc-a1
            HostName ssh-djc.itsdev.kr
            User $SERVER_USER
            IdentityFile ~/.ssh/id_rsa
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking accept-new
            BatchMode yes
          EOF
          chmod 600 ~/.ssh/config

          remote_env="/home/$SERVER_USER/djc-diagnostic.env"
          scp diagnostic.env "djc-a1:$remote_env"
          ssh djc-a1 "sudo bash -s -- '$remote_env'" <<'REMOTE'
          set -euo pipefail
          env_file="$1"
          container='djc-runtime-diagnostic'
          image='ghcr.io/aerofleet/devjobcollector:cb3ec04c0571dc869b161b8648e82db22bfceddc'

          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
            rm -f "$env_file"
          }
          trap cleanup EXIT
          docker rm --force "$container" >/dev/null 2>&1 || true

          docker run --detach \
            --name "$container" \
            --env-file "$env_file" \
            --publish 127.0.0.1:18080:8080 \
            "$image" >/dev/null

          for attempt in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Status}}' "$container" 2>/dev/null || true)"
            if [ "$status" = 'exited' ]; then
              break
            fi
            if curl --silent --output /tmp/djc-health.json http://127.0.0.1:18080/actuator/health; then
              echo '=== health details ==='
              cat /tmp/djc-health.json
              echo
              break
            fi
            sleep 2
          done

          echo '=== diagnostic container logs ==='
          docker logs --tail 500 "$container" 2>&1 || true
          rm -f /tmp/djc-health.json
          REMOTE

          rm -f diagnostic.env
