name: Deploy DJC Backend Container to Oracle Cloud

on:
  push:
    branches:
      - main
    paths:
      - "devjobcollector/src/**"
      - "devjobcollector/auth-common/**"
      - "devjobcollector/build.gradle"
      - "devjobcollector/settings.gradle"
      - "devjobcollector/gradle/**"
      - "devjobcollector/gradlew"
      - "devjobcollector/Dockerfile"
      - "devjobcollector/compose.yaml"
      - "devjobcollector/ops/docker/**"
      - ".github/workflows/djc-backend-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY: ghcr.io/aerofleet/devjobcollector
  CLOUDFLARED_VERSION: 2026.5.1
  CLOUDFLARED_SHA256: 4274f6106efbe586e8e2127aba02798c55bcfd99a45d14f08779d6afc51e8752

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Run backend tests
        working-directory: ./devjobcollector
        run: |
          chmod +x gradlew
          ./gradlew clean test --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push deploy image
        uses: docker/build-push-action@v7
        with:
          context: ./devjobcollector
          file: ./devjobcollector/Dockerfile
          platforms: linux/amd64
          push: true
          pull: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
            ${{ env.IMAGE_REPOSITORY }}:latest
          cache-from: type=gha,scope=djc-deploy
          cache-to: type=gha,mode=max,scope=djc-deploy

      - name: Validate deployment secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          DB_SERVER_IP: ${{ secrets.DB_SERVER_IP }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          API_SERVICE_KEY: ${{ secrets.API_SERVICE_KEY }}
          AUTH_TOKEN_SECRET: ${{ secrets.AUTH_TOKEN_SECRET }}
          AUTH_FRONTEND_SUCCESS_URI: ${{ secrets.AUTH_FRONTEND_SUCCESS_URI }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          required=(SSH_PRIVATE_KEY SERVER_USER CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET DB_SERVER_IP DB_USERNAME DB_PASSWORD API_SERVICE_KEY AUTH_TOKEN_SECRET AUTH_FRONTEND_SUCCESS_URI GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET)
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub secret: ${name}"
              exit 1
            fi
          done

      - name: Prepare deployment bundle
        env:
          DB_SERVER_IP: ${{ secrets.DB_SERVER_IP }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          API_SERVICE_KEY: ${{ secrets.API_SERVICE_KEY }}
          SARAMIN_ACCESS_KEY: ${{ secrets.SARAMIN_ACCESS_KEY }}
          AUTH_TOKEN_SECRET: ${{ secrets.AUTH_TOKEN_SECRET }}
          AUTH_FRONTEND_SUCCESS_URI: ${{ secrets.AUTH_FRONTEND_SUCCESS_URI }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.DJC_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.DJC_GITHUB_CLIENT_SECRET }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          AUTH_SIGNUP_MAIL_FROM: ${{ secrets.AUTH_SIGNUP_MAIL_FROM }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p deploy-bundle

          mail_enabled=false
          if [ -n "$MAIL_HOST" ] && [ -n "$MAIL_USERNAME" ] && [ -n "$MAIL_PASSWORD" ] && [ -n "$AUTH_SIGNUP_MAIL_FROM" ]; then
            mail_enabled=true
          fi

          turnstile_enabled=false
          if [ -n "$TURNSTILE_SECRET_KEY" ]; then
            turnstile_enabled=true
          fi

          {
            printf '%s\n' "SPRING_PROFILES_ACTIVE=prod"
            printf '%s\n' "SPRING_DATASOURCE_URL=jdbc:mysql://${DB_SERVER_IP}:3306/devjob?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true"
            printf '%s\n' "SPRING_DATASOURCE_USERNAME=$DB_USERNAME"
            printf '%s\n' "DB_PASSWORD=$DB_PASSWORD"
            printf '%s\n' "SPRING_DATASOURCE_PASSWORD=$DB_PASSWORD"
            printf '%s\n' "API_SERVICE_KEY=$API_SERVICE_KEY"
            printf '%s\n' "SARAMIN_ACCESS_KEY=$SARAMIN_ACCESS_KEY"
            printf '%s\n' "SARAMIN_COLLECTION_ENABLED=$([ -n "$SARAMIN_ACCESS_KEY" ] && echo true || echo false)"
            printf '%s\n' "TOSS_COLLECTION_ENABLED=true"
            printf '%s\n' "NAVER_COLLECTION_ENABLED=true"
            printf '%s\n' "ATS_COLLECTION_ENABLED=true"
            printf '%s\n' "AUTH_FRONTEND_SUCCESS_URI=$AUTH_FRONTEND_SUCCESS_URI"
            printf '%s\n' "AUTH_TOKEN_SECRET=$AUTH_TOKEN_SECRET"
            printf '%s\n' "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID"
            printf '%s\n' "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET"
            printf '%s\n' "SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID"
            printf '%s\n' "SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET"
            if [ -n "$GITHUB_CLIENT_ID" ] && [ -n "$GITHUB_CLIENT_SECRET" ]; then
              printf '%s\n' "GITHUB_CLIENT_ID=$GITHUB_CLIENT_ID"
              printf '%s\n' "GITHUB_CLIENT_SECRET=$GITHUB_CLIENT_SECRET"
              printf '%s\n' "SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_CLIENT_ID=$GITHUB_CLIENT_ID"
              printf '%s\n' "SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_CLIENT_SECRET=$GITHUB_CLIENT_SECRET"
            fi
            printf '%s\n' "MAIL_HOST=$MAIL_HOST"
            printf '%s\n' "MAIL_PORT=${MAIL_PORT:-587}"
            printf '%s\n' "MAIL_USERNAME=$MAIL_USERNAME"
            printf '%s\n' "MAIL_PASSWORD=$MAIL_PASSWORD"
            printf '%s\n' "AUTH_SIGNUP_MAIL_ENABLED=$mail_enabled"
            if [ -n "$AUTH_SIGNUP_MAIL_FROM" ]; then
              printf '%s\n' "AUTH_SIGNUP_MAIL_FROM=$AUTH_SIGNUP_MAIL_FROM"
            fi
            printf '%s\n' "AUTH_SIGNUP_TURNSTILE_ENABLED=$turnstile_enabled"
            printf '%s\n' "TURNSTILE_SECRET_KEY=$TURNSTILE_SECRET_KEY"
            printf '%s\n' "DJC_IMAGE_REPOSITORY=${IMAGE_REPOSITORY}"
            printf '%s\n' "DJC_IMAGE_TAG=${GITHUB_SHA}"
            printf '%s\n' "DJC_ENV_FILE=/etc/devjobcollector/devjobcollector.env"
            printf '%s\n' "DJC_BIND_ADDRESS=127.0.0.1"
            printf '%s\n' "DJC_PORT=8080"
          } > deploy-bundle/devjobcollector.env

          printf '%s' "$GHCR_TOKEN" > deploy-bundle/ghcr-token
          printf '%s' "$GHCR_USERNAME" > deploy-bundle/ghcr-username
          cp devjobcollector/compose.yaml deploy-bundle/compose.yaml
          cp devjobcollector/ops/docker/deploy.sh deploy-bundle/deploy.sh
          chmod 600 deploy-bundle/*
          chmod 700 deploy-bundle/deploy.sh

      - name: Install cloudflared client
        run: |
          set -euo pipefail
          package="cloudflared-linux-amd64.deb"
          curl --fail --location --retry 3 \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/${package}" \
            --output "$package"
          printf '%s  %s\n' "$CLOUDFLARED_SHA256" "$package" | sha256sum --check --strict
          sudo dpkg -i "$package"
          cloudflared --version

      - name: Deploy container through Cloudflare Tunnel
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          cat > ~/.ssh/config <<EOF
          Host djc-a1
            HostName ssh-djc.itsdev.kr
            User $SERVER_USER
            IdentityFile ~/.ssh/id_rsa
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking accept-new
            BatchMode yes
            ConnectTimeout 20
            ConnectionAttempts 3
            ServerAliveInterval 15
            ServerAliveCountMax 3
          EOF
          chmod 600 ~/.ssh/config

          REMOTE_BUNDLE="/home/$SERVER_USER/djc-deploy"

          ssh djc-a1 "mkdir -p '$REMOTE_BUNDLE' && chmod 700 '$REMOTE_BUNDLE'"
          scp deploy-bundle/* "djc-a1:$REMOTE_BUNDLE/"
          ssh djc-a1 "sudo '$REMOTE_BUNDLE/deploy.sh' '$REMOTE_BUNDLE'"

      - name: Deployment completed
        run: echo "DJC container deployment completed"
