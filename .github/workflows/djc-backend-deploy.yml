name: Deploy DJC Backend to Oracle Cloud

on:
  push:
    branches:
      - main
    paths:
      - "devjobcollector/src/**"
      - "devjobcollector/auth-common/**"
      - "devjobcollector/build.gradle"
      - "devjobcollector/settings.gradle"
      - "devjobcollector/gradle/**"
      - "devjobcollector/gradlew"
      - "devjobcollector/ops/systemd/**"
      - ".github/workflows/djc-backend-deploy.yml"
  workflow_dispatch:
  
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Make gradlew executable
        working-directory: ./devjobcollector
        run: chmod +x gradlew
      
      - name: Build with Gradle
        working-directory: ./devjobcollector
        run: ./gradlew clean build --no-daemon
      
      - name: List JAR files
        working-directory: ./devjobcollector
        run: ls -lh build/libs/
      
      - name: Deploy to Oracle Cloud
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          API_SERVICE_KEY: ${{ secrets.API_SERVICE_KEY }}
          SARAMIN_ACCESS_KEY: ${{ secrets.SARAMIN_ACCESS_KEY }}
          SARAMIN_COLLECTION_ENABLED: ${{ secrets.SARAMIN_ACCESS_KEY != '' }}
          TOSS_COLLECTION_ENABLED: "true"
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          echo "has SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY != '' }}"
          echo "has SERVER_IP: ${{ secrets.SERVER_IP != '' }}"
          echo "has SERVER_USER: ${{ secrets.SERVER_USER != '' }}"
          echo "has DB_PASSWORD: ${{ secrets.DB_PASSWORD != '' }}"
          echo "has API_SERVICE_KEY: ${{ secrets.API_SERVICE_KEY != '' }}"
          echo "has SARAMIN_ACCESS_KEY: ${{ secrets.SARAMIN_ACCESS_KEY != '' }}"
          echo "has GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID != '' }}"
          echo "has GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET != '' }}"

          [ "${{ secrets.SSH_PRIVATE_KEY != '' }}" = "true" ] || (echo "Missing SSH_PRIVATE_KEY"; exit 1)
          [ "${{ secrets.SERVER_IP != '' }}" = "true" ] || (echo "Missing SERVER_IP"; exit 1)
          [ "${{ secrets.SERVER_USER != '' }}" = "true" ] || (echo "Missing SERVER_USER"; exit 1)
          [ "${{ secrets.DB_PASSWORD != '' }}" = "true" ] || (echo "Missing DB_PASSWORD"; exit 1)
          [ "${{ secrets.API_SERVICE_KEY != '' }}" = "true" ] || (echo "Missing API_SERVICE_KEY"; exit 1)
          [ "${{ secrets.GOOGLE_CLIENT_ID != '' }}" = "true" ] || (echo "Missing GOOGLE_CLIENT_ID"; exit 1)
          [ "${{ secrets.GOOGLE_CLIENT_SECRET != '' }}" = "true" ] || (echo "Missing GOOGLE_CLIENT_SECRET"; exit 1)

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts 2>/dev/null || true

          SSH_OPTS="-i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ConnectionAttempts=5 -o ServerAliveInterval=15 -o ServerAliveCountMax=3"

          retry() {
            local n=1
            local max=5
            local delay=6
            while true; do
              "$@" && break || {
                if [ $n -lt $max ]; then
                  n=$((n+1))
                  echo "Retry $n/$max: $*"
                  sleep $delay
                else
                  echo "Command failed after $max attempts: $*"
                  return 1
                fi
              }
            done
          }
          
          echo "=== Deploying JAR ==="
          retry scp $SSH_OPTS \
            devjobcollector/build/libs/devjobcollector-0.0.1-SNAPSHOT.jar \
            $SERVER_USER@$SERVER_IP:/home/ubuntu/app.jar.next

          echo "=== Deploying systemd files ==="
          retry scp $SSH_OPTS \
            devjobcollector/ops/systemd/djc-start.sh \
            $SERVER_USER@$SERVER_IP:/home/ubuntu/djc-start.sh
          retry scp $SSH_OPTS \
            devjobcollector/ops/systemd/devjobcollector.service \
            $SERVER_USER@$SERVER_IP:/home/ubuntu/devjobcollector.service
          
          echo "=== Starting Application ==="
          ssh $SSH_OPTS $SERVER_USER@$SERVER_IP \
            "DB_PASSWORD='$DB_PASSWORD' API_SERVICE_KEY='$API_SERVICE_KEY' SARAMIN_ACCESS_KEY='$SARAMIN_ACCESS_KEY' SARAMIN_COLLECTION_ENABLED='$SARAMIN_COLLECTION_ENABLED' TOSS_COLLECTION_ENABLED='$TOSS_COLLECTION_ENABLED' GOOGLE_CLIENT_ID='$GOOGLE_CLIENT_ID' GOOGLE_CLIENT_SECRET='$GOOGLE_CLIENT_SECRET' bash -s" << 'ENDSSH'
          set -euo pipefail

          cat > /home/ubuntu/djc.env <<EOF
          DB_PASSWORD=${DB_PASSWORD}
          API_SERVICE_KEY=${API_SERVICE_KEY}
          SARAMIN_ACCESS_KEY=${SARAMIN_ACCESS_KEY}
          SARAMIN_COLLECTION_ENABLED=${SARAMIN_COLLECTION_ENABLED}
          TOSS_COLLECTION_ENABLED=${TOSS_COLLECTION_ENABLED}
          GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
          GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
          EOF
          chmod 600 /home/ubuntu/djc.env

          echo "DB_PASSWORD length: ${#DB_PASSWORD}"
          echo "API_SERVICE_KEY length: ${#API_SERVICE_KEY}"
          echo "SARAMIN collection enabled: ${SARAMIN_COLLECTION_ENABLED}"
          echo "TOSS collection enabled: ${TOSS_COLLECTION_ENABLED}"
          echo "GOOGLE_CLIENT_ID length: ${#GOOGLE_CLIENT_ID}"
          echo "GOOGLE_CLIENT_SECRET length: ${#GOOGLE_CLIENT_SECRET}"

          sudo install -m 0755 /home/ubuntu/djc-start.sh /usr/local/bin/djc-start.sh
          sudo install -m 0644 /home/ubuntu/devjobcollector.service /etc/systemd/system/devjobcollector.service
          sudo systemctl daemon-reload
          sudo systemctl enable devjobcollector.service

          echo "=== Stopping previous application ==="
          sudo systemctl stop devjobcollector.service || true
          for attempt in $(seq 1 30); do
            if ! sudo systemctl is-active --quiet devjobcollector.service; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Previous application did not stop within 30 seconds"
              exit 1
            fi
            sleep 1
          done

          echo "=== Replacing JAR atomically ==="
          test -s /home/ubuntu/app.jar.next
          mv /home/ubuntu/app.jar.next /home/ubuntu/app.jar

          echo "=== Starting new application ==="
          sudo systemctl start devjobcollector.service

          expected_pid=""
          for attempt in $(seq 1 20); do
            expected_pid=$(sudo systemctl show devjobcollector.service --property MainPID --value)
            if [ -n "$expected_pid" ] && [ "$expected_pid" -gt 0 ]; then
              break
            fi
            sleep 1
          done

          if [ -z "$expected_pid" ] || [ "$expected_pid" -le 0 ]; then
            echo "New application process did not start"
            sudo systemctl --no-pager -l status devjobcollector.service || true
            exit 1
          fi
          echo "New application PID: $expected_pid"

          healthy=false
          for attempt in $(seq 1 60); do
            current_pid=$(sudo systemctl show devjobcollector.service --property MainPID --value)
            if [ "$current_pid" != "$expected_pid" ]; then
              echo "Application PID changed during startup: expected=$expected_pid current=$current_pid"
              break
            fi
            if curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
              echo
              echo "Backend health check passed on attempt ${attempt}/60"
              healthy=true
              break
            fi
            sleep 2
          done

          echo "=== Recent collector logs ==="
          grep -E 'ATS target|ATS collection|공공데이터|수집|API 응답|신규 저장|중복 스킵|실패/오류|Exception|ERROR|WARN' /home/ubuntu/app.log | tail -n 120 || true

          if [ "$healthy" = "true" ]; then
            exit 0
          fi

          sudo systemctl --no-pager -l status devjobcollector.service | sed -n '1,40p' || true
          sudo journalctl -u devjobcollector.service --no-pager -n 80 || true
          tail -n 120 /home/ubuntu/app.log || true
          echo "Backend health check failed after 120 seconds"
          exit 1
          ENDSSH
      
      - name: Deployment completed
        run: echo "✅ Deployment completed!"
