name: Verify DJC AI evidence integration

on:
  push:
    branches: [codex/djc-ai-evidence]
  workflow_dispatch:
    inputs:
      audit_email:
        description: Read-only location audit for one account; empty runs normal verification
        type: string
        default: ''
      model_access_only:
        description: Check model visibility without generating content
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: djc-ai-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  location-audit:
    if: ${{ inputs.audit_email != '' && inputs.audit_email != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Cloudflare client
        run: |
          curl --fail --location --retry 3 https://github.com/cloudflare/cloudflared/releases/download/2026.5.1/cloudflared-linux-amd64.deb -o cloudflared.deb
          echo '4274f6106efbe586e8e2127aba02798c55bcfd99a45d14f08779d6afc51e8752  cloudflared.deb' | sha256sum --check --strict
          sudo dpkg -i cloudflared.deb
      - name: Read account location choices and runtime version
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          AUDIT_EMAIL: ${{ inputs.audit_email }}
        run: |
          set -euo pipefail
          echo "::add-mask::$AUDIT_EMAIL"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat > ~/.ssh/config <<EOF
          Host djc-a1
            HostName ssh-djc.itsdev.kr
            User $SERVER_USER
            IdentityFile ~/.ssh/id_rsa
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking accept-new
            BatchMode yes
            ConnectTimeout 20
          EOF
          chmod 600 ~/.ssh/config
          encoded=$(printf '%s' "$AUDIT_EMAIL" | base64 -w0)
          ssh djc-a1 "sudo python3 - '$encoded'" < .codex/diagnostics/location-audit.py
  model-access:
    if: ${{ inputs.model_access_only == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check model visibility without exposing credentials or response bodies
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: python
        run: |
          import json, os, urllib.request, urllib.error
          key = os.environ.get("OPENAI_API_KEY", "")
          if not key:
              raise SystemExit("OPENAI_API_KEY is not configured")
          request = urllib.request.Request(
              "https://api.openai.com/v1/models",
              headers={"Authorization": "Bearer " + key})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.load(response)
          except urllib.error.HTTPError as error:
              raise SystemExit("Model inventory HTTP " + str(error.code)) from None
          except Exception:
              raise SystemExit("Model inventory request failed") from None
          available = {entry.get("id") for entry in data.get("data", [])}
          for candidate in ("gpt-5-nano", "gpt-5-mini", "gpt-5.4-mini", "gpt-5.4-mini-2026-03-17"):
              print(candidate + ": " + ("visible" if candidate in available else "not listed"))
          print("Visibility does not verify Responses permission or coaching quality.")
  verify:
    if: ${{ inputs.model_access_only != true && (inputs.audit_email == '' || inputs.audit_email == null) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:26.7.0
        env:
          MYSQL_ROOT_PASSWORD: djc-ai-ci-only
          MYSQL_DATABASE: devjob
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pdjc-ai-ci-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Backend regression tests
        working-directory: devjobcollector
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon
      - name: MySQL analysis and external-attempt transaction tests
        working-directory: devjobcollector
        env:
          DJC_MIGRATION_TEST_URL: jdbc:mysql://127.0.0.1:3306/devjob?allowPublicKeyRetrieval=true&useSSL=false
          DJC_MIGRATION_TEST_PASSWORD: djc-ai-ci-only
        run: ./gradlew test --tests '*ai.ResumeAnalysisIntegrationTest' --tests '*career.ResumeServiceIntegrationTest' --no-daemon
      - name: Live model contracts with synthetic evidence and resume text
        working-directory: devjobcollector
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DJC_OPENAI_LIVE_TEST: "true"
        run: ./gradlew test --tests '*ai.OpenAiEvidenceLiveTest' --no-daemon
      - name: Preserve synthetic model contract results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-model-contract
          path: devjobcollector/build/test-results/test/TEST-*OpenAiEvidenceLiveTest.xml
          retention-days: 3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: devjobcollector/frontend/package-lock.json
      - name: Frontend lint, build and browser tests
        working-directory: devjobcollector/frontend
        run: |
          npm ci
          npm run lint
          npm run build
          npx playwright install --with-deps chromium
          npx playwright test e2e/resume-analysis.spec.js e2e/resume-journey.spec.js e2e/home-recommendations.spec.js --workers=2
