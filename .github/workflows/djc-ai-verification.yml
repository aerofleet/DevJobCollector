name: Verify DJC AI evidence integration

on:
  push:
    branches: [codex/djc-ai-evidence]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: djc-ai-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:26.7.0
        env:
          MYSQL_ROOT_PASSWORD: djc-ai-ci-only
          MYSQL_DATABASE: devjob
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pdjc-ai-ci-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Backend regression tests
        working-directory: devjobcollector
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon
      - name: MySQL analysis and external-attempt transaction tests
        working-directory: devjobcollector
        env:
          DJC_MIGRATION_TEST_URL: jdbc:mysql://127.0.0.1:3306/devjob?allowPublicKeyRetrieval=true&useSSL=false
          DJC_MIGRATION_TEST_PASSWORD: djc-ai-ci-only
        run: ./gradlew test --tests '*ai.ResumeAnalysisIntegrationTest' --no-daemon
      - name: Live model contracts with synthetic evidence and resume text
        working-directory: devjobcollector
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DJC_OPENAI_LIVE_TEST: "true"
        run: ./gradlew test --tests '*ai.OpenAiEvidenceLiveTest' --no-daemon
      - name: Preserve synthetic model contract results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-model-contract
          path: devjobcollector/build/test-results/test/TEST-*OpenAiEvidenceLiveTest.xml
          retention-days: 3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: devjobcollector/frontend/package-lock.json
      - name: Frontend lint, build and browser tests
        working-directory: devjobcollector/frontend
        run: |
          npm ci
          npm run lint
          npm run build
          npx playwright install --with-deps chromium
          npx playwright test e2e/resume-analysis.spec.js e2e/resume-journey.spec.js --workers=2
