name: Deploy DJC Admin to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - "devjobcollector/admin-frontend/**"
      - ".github/workflows/djc-admin-frontend-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    env:
      VITE_ADMIN_API_BASE_URL: ${{ vars.VITE_ADMIN_API_BASE_URL }}
    defaults:
      run:
        working-directory: ./devjobcollector/admin-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: devjobcollector/admin-frontend/package-lock.json

      - name: Determine deployment readiness
        id: deploy-config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$VITE_ADMIN_API_BASE_URL" ]; then
            echo "::notice::Admin deployment skipped until Cloudflare secrets and VITE_ADMIN_API_BASE_URL are configured"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$VITE_ADMIN_API_BASE_URL" in
            http://localhost:*|https://localhost:*)
              echo "VITE_ADMIN_API_BASE_URL must not point to localhost"
              exit 1
              ;;
          esac
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm run e2e

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        if: steps.deploy-config.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
