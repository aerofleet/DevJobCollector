name: DJC growth validation
on:
  push:
    branches: [main, verify/djc-growth]
    paths: ['devjobcollector/**', '.github/workflows/djc-growth-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  growth:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:26.7.0
        env:
          MYSQL_ROOT_PASSWORD: growth-test-only
          MYSQL_DATABASE: devjob
        ports: ['33306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pgrowth-test-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
    defaults:
      run:
        working-directory: devjobcollector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Security and MySQL migration / aggregation
        env:
          DJC_MIGRATION_TEST_URL: jdbc:mysql://127.0.0.1:33306/devjob?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
          DJC_MIGRATION_TEST_USERNAME: root
          DJC_MIGRATION_TEST_PASSWORD: growth-test-only
        run: bash ./gradlew test --tests 'kr.itsdev.devjobcollector.growth.*' --tests 'kr.itsdev.devjobcollector.repository.JobSearchRepositoryIntegrationTest' --tests 'kr.itsdev.devjobcollector.company.CompanyJobIntegrationTest' --tests 'kr.itsdev.devjobcollector.company.jobs.CompanyJobContentTest' --tests 'kr.itsdev.devjobcollector.migration.CompanyJobV12MigrationTest' --console=plain
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: devjobcollector/frontend/package-lock.json
      - name: Worker and prerender
        working-directory: devjobcollector/frontend
        run: |
          npm ci
          node --test worker/seo.test.mjs worker/jobPosting.test.mjs
          npm run lint
          npm run build
      - name: Built homepage hydration
        working-directory: devjobcollector/frontend
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --config playwright.built.config.js --workers=2
