name: DJC Auth Career Observation

on:
  workflow_dispatch:
    inputs:
      observation_hours:
        description: Rolling production log window in hours
        required: true
        default: "1"

permissions:
  contents: read

concurrency:
  group: djc-auth-career-observation
  cancel-in-progress: false

env:
  API_BASE_URL: https://djc-api.itsdev.kr
  CLOUDFLARED_VERSION: 2026.5.1
  CLOUDFLARED_SHA256: 4274f6106efbe586e8e2127aba02798c55bcfd99a45d14f08779d6afc51e8752

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate observation input
        env:
          OBSERVATION_HOURS: ${{ inputs.observation_hours }}
        run: |
          if ! [[ "$OBSERVATION_HOURS" =~ ^[1-9][0-9]*$ ]] || [ "$OBSERVATION_HOURS" -gt 168 ]; then
            echo "::error::observation_hours must be an integer from 1 through 168"
            exit 1
          fi

      - name: Run read-only production probes
        working-directory: ./devjobcollector
        run: |
          set -euo pipefail
          assert_status() {
            local expected="$1"
            local url="$2"
            local actual
            actual="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$url")"
            if [ "$actual" != "$expected" ]; then
              echo "::error::Unexpected HTTP status for production probe: expected $expected, got $actual"
              exit 1
            fi
          }

          assert_status 200 "$API_BASE_URL/actuator/health"
          assert_status 200 "$API_BASE_URL/api/v1/jobs/search?page=0&size=1"
          assert_status 401 "$API_BASE_URL/api/v1/members/me"
          assert_status 401 "$API_BASE_URL/api/v1/members/me/bookmarks"
          assert_status 401 "$API_BASE_URL/api/v1/members/me/recent-jobs"
          assert_status 401 "$API_BASE_URL/api/v1/members/me/applications"
          assert_status 401 "$API_BASE_URL/api/v1/members/me/resumes"
          echo "PASS read-only production probes: 7/7"

      - name: Install cloudflared client
        run: |
          set -euo pipefail
          package="cloudflared-linux-amd64.deb"
          curl --fail --location --retry 3 \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/${package}" \
            --output "$package"
          printf '%s  %s\n' "$CLOUDFLARED_SHA256" "$package" | sha256sum --check --strict
          sudo dpkg -i "$package"

      - name: Configure production log access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          required=(SSH_PRIVATE_KEY SERVER_USER TUNNEL_SERVICE_TOKEN_ID TUNNEL_SERVICE_TOKEN_SECRET)
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required production access secret: $name"
              exit 1
            fi
          done

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat > ~/.ssh/config <<EOF
          Host djc-a1
            HostName ssh-djc.itsdev.kr
            User $SERVER_USER
            IdentityFile ~/.ssh/id_rsa
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking accept-new
            BatchMode yes
            ConnectTimeout 20
            ConnectionAttempts 3
          EOF
          chmod 600 ~/.ssh/config

      - name: Audit aggregate auth and Career API errors
        env:
          OBSERVATION_HOURS: ${{ inputs.observation_hours }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          container_state="$(ssh djc-a1 '
            container_id="$(sudo docker compose --project-name djc --env-file /etc/devjobcollector/devjobcollector.env -f /opt/devjobcollector/compose.yaml ps -q app)"
            if [ -z "$container_id" ]; then
              echo "container_state=NOT_RUNNING"
              exit 1
            fi
            sudo docker inspect --format "container_started_at={{.State.StartedAt}} restart_count={{.RestartCount}}" "$container_id"
          ')"
          set +e
          report="$({
            ssh djc-a1 \
              "sudo docker compose --project-name djc --env-file /etc/devjobcollector/devjobcollector.env -f /opt/devjobcollector/compose.yaml logs --no-color --since '${OBSERVATION_HOURS}h' app"
          } | DJC_OBSERVATION_HOURS="$OBSERVATION_HOURS" \
              bash devjobcollector/ops/auth/audit-auth-career-logs.sh)"
          audit_status=$?
          set -e

          printf '%s\n' "$container_state"
          printf '%s\n' "$report"
          {
            echo "## DJC authentication and Career observation"
            echo
            echo '```text'
            printf '%s\n' "$container_state"
            printf '%s\n' "$report"
            echo '```'
            echo
            echo "Raw production logs were not uploaded or printed."
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$audit_status"

      - name: Inspect discovery request timing aggregates
        if: always()
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          ssh djc-a1 "sudo docker compose --project-name djc --env-file /etc/devjobcollector/devjobcollector.env -f /opt/devjobcollector/compose.yaml logs --no-color --since 2h app" |
            python3 -c 'import re,sys,collections; s=sys.stdin.read(); p=r"API timing \[POST /api/v1/admin/companies/public-seeds/\d+/discover\] status=(\d+) elapsedMs=([\d.]+)"; a=re.findall(p,s); print("discovery_requests:", len(a)); [print("status=%s elapsed_ms=%s" % x) for x in a[-20:]]; print("exception_counts:"); c=collections.Counter(re.findall(r"\b([A-Za-z]+(?:Exception|Error))\b",s)); [print(k,v) for k,v in c.most_common(25)]'

      - name: Probe public board from production host
        if: always()
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          ssh djc-a1 'bash -s' <<'REMOTE'
          set +e
          for path in /robots.txt /ko/apply; do
            printf 'host path=%s ' "$path"
            curl -sS -o /dev/null -w 'status=%{http_code} elapsed=%{time_total}\n' --max-time 15 -A 'DevJobCollector/1.0 (+https://itsdev.kr)' "https://cnccosmetic.career.greetinghr.com$path"
          done
          container_id="$(sudo docker compose --project-name djc --env-file /etc/devjobcollector/devjobcollector.env -f /opt/devjobcollector/compose.yaml ps -q app)"
          sudo docker exec "$container_id" sh -c 'command -v curl || command -v wget || true'
          for path in /robots.txt /ko/apply; do
            printf 'container path=%s ' "$path"
            sudo docker exec "$container_id" curl -sS -o /dev/null -w 'status=%{http_code} elapsed=%{time_total}\n' --max-time 15 -A 'DevJobCollector/1.0 (+https://itsdev.kr)' "https://cnccosmetic.career.greetinghr.com$path"
          done
          printf 'DNS host records IPv6 count: '
          sudo docker exec "$container_id" sh -c "getent hosts cnccosmetic.career.greetinghr.com | awk '\$1 ~ /:/ {n++} END {print n+0}'"
          printf '%s' '' | sudo docker exec -i "$container_id" sh -c 'base64 -d > /tmp/DjcBoardProbe.class && java -cp /tmp DjcBoardProbe'
          printf '%s' '' | sudo docker exec -i "$container_id" sh -c 'base64 -d > /tmp/DnsFamilies.class && java -cp /tmp DnsFamilies'
          REMOTE
