name: Validate DJC Docker image

on:
  push:
    branches:
      - main
    paths:
      - "devjobcollector/Dockerfile"
      - "devjobcollector/compose.yaml"
      - "devjobcollector/.dockerignore"
      - "devjobcollector/.env.docker.example"
      - "devjobcollector/src/**"
      - "devjobcollector/auth-common/**"
      - "devjobcollector/build.gradle"
      - "devjobcollector/settings.gradle"
      - "devjobcollector/gradle/**"
      - "devjobcollector/gradlew"
      - ".github/workflows/djc-docker-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "devjobcollector/Dockerfile"
      - "devjobcollector/compose.yaml"
      - "devjobcollector/.dockerignore"
      - "devjobcollector/.env.docker.example"
      - "devjobcollector/src/**"
      - "devjobcollector/auth-common/**"
      - "devjobcollector/build.gradle"
      - "devjobcollector/settings.gradle"
      - "devjobcollector/gradle/**"
      - "devjobcollector/gradlew"
      - ".github/workflows/djc-docker-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build linux/amd64 and linux/arm64
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        working-directory: devjobcollector
        env:
          DJC_ENV_FILE: ${{ github.workspace }}/devjobcollector/.env.docker.example
        run: docker compose -f compose.yaml config --quiet

      - name: Validate DJC migrations on clean MySQL
        working-directory: devjobcollector
        run: |
          set -euo pipefail
          container="djc-flyway-ci-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name "$container" \
            --env MYSQL_ROOT_PASSWORD=djc-ci-root \
            --env MYSQL_DATABASE=devjob \
            mysql:8.4 >/dev/null

          for attempt in $(seq 1 30); do
            if docker exec "$container" mysqladmin ping --host 127.0.0.1 --user root --password=djc-ci-root --silent; then
              break
            fi
            if [ "$attempt" = '30' ]; then
              echo '::error::MySQL did not become ready'
              exit 1
            fi
            sleep 2
          done

          for migration in $(find src/main/resources/db/migration -maxdepth 1 -name 'V*.sql' | sort -V); do
            docker exec --interactive "$container" \
              mysql --user root --password=djc-ci-root devjob < "$migration"
          done

          table_count="$(docker exec "$container" \
            mysql --user root --password=djc-ci-root --batch --skip-column-names devjob \
              --execute 'SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = "devjob";')"
          test "$table_count" = '10'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image for amd64 and arm64
        uses: docker/build-push-action@v7
        with:
          context: ./devjobcollector
          file: ./devjobcollector/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          pull: true
          tags: ghcr.io/aerofleet/devjobcollector:ci-${{ github.sha }}
          cache-from: type=gha,scope=djc-docker
          cache-to: type=gha,mode=max,scope=djc-docker
