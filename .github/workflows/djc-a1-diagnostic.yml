name: Diagnose DJC A1 Runtime

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARED_VERSION: 2026.5.1
  CLOUDFLARED_SHA256: 4274f6106efbe586e8e2127aba02798c55bcfd99a45d14f08779d6afc51e8752

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install cloudflared client
        run: |
          set -euo pipefail
          package="cloudflared-linux-amd64.deb"
          curl --fail --location --retry 3 \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/${package}" \
            --output "$package"
          printf '%s  %s\n' "$CLOUDFLARED_SHA256" "$package" | sha256sum --check --strict
          sudo dpkg -i "$package"

      - name: Inspect runtime through Cloudflare Tunnel
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          cat > ~/.ssh/config <<EOF
          Host djc-a1
            HostName ssh-djc.itsdev.kr
            User $SERVER_USER
            IdentityFile ~/.ssh/id_rsa
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking accept-new
            BatchMode yes
          EOF
          chmod 600 ~/.ssh/config

          ssh djc-a1 'sudo bash -s' <<'REMOTE'
          set -euo pipefail

          echo '=== candidate services ==='
          systemctl list-units --type=service --all --no-legend \
            | awk 'tolower($1) ~ /(devjob|djc)/ { print $1, $3, $4 }'

          echo '=== listener on tcp/8080 ==='
          ss -H -ltnp '( sport = :8080 )' || true

          echo '=== listener process metadata ==='
          listener_pid="$(ss -H -ltnp '( sport = :8080 )' \
            | sed -n 's/.*pid=\([0-9][0-9]*\).*/\1/p' \
            | head -n 1)"
          if [ -n "$listener_pid" ]; then
            printf 'pid=%s exe=' "$listener_pid"
            readlink "/proc/$listener_pid/exe" || true
            echo 'cgroup:'
            cat "/proc/$listener_pid/cgroup" || true
          else
            echo 'No listener PID found'
          fi

          echo '=== running containers ==='
          docker ps --format 'table {{.ID}}\t{{.Image}}\t{{.Ports}}\t{{.Names}}'
          REMOTE
