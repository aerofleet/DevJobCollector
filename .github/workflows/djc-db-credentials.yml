name: Provision DJC Database Credentials

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install cloudflared client
        env:
          CLOUDFLARED_VERSION: 2026.5.1
          CLOUDFLARED_SHA256: 4274f6106efbe586e8e2127aba02798c55bcfd99a45d14f08779d6afc51e8752
        run: |
          set -euo pipefail
          package="cloudflared-linux-amd64.deb"
          curl --fail --location --retry 3 \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/${package}" \
            --output "$package"
          printf '%s  %s\n' "$CLOUDFLARED_SHA256" "$package" | sha256sum --check --strict
          sudo dpkg -i "$package"

      - name: Prepare encrypted credential payload
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          FLYWAY_USERNAME: ${{ secrets.FLYWAY_USERNAME }}
          FLYWAY_PASSWORD: ${{ secrets.FLYWAY_PASSWORD }}
        run: |
          set -euo pipefail
          required=(DB_USERNAME DB_PASSWORD FLYWAY_USERNAME FLYWAY_PASSWORD)
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub secret: ${name}"
              exit 1
            fi
          done
          umask 077
          {
            printf 'DB_USERNAME_B64=%s\n' "$(printf '%s' "$DB_USERNAME" | base64 -w0)"
            printf 'DB_PASSWORD_B64=%s\n' "$(printf '%s' "$DB_PASSWORD" | base64 -w0)"
            printf 'FLYWAY_USERNAME_B64=%s\n' "$(printf '%s' "$FLYWAY_USERNAME" | base64 -w0)"
            printf 'FLYWAY_PASSWORD_B64=%s\n' "$(printf '%s' "$FLYWAY_PASSWORD" | base64 -w0)"
          } > credentials.env

      - name: Back up database and provision scoped accounts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat > ~/.ssh/config <<EOF
          Host djc-a1
            HostName ssh-djc.itsdev.kr
            User $SERVER_USER
            IdentityFile ~/.ssh/id_rsa
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking accept-new
            BatchMode yes
            ConnectTimeout 20
            ConnectionAttempts 3
          EOF
          chmod 600 ~/.ssh/config

          remote_payload="/home/$SERVER_USER/djc-db-credentials.env"
          scp credentials.env "djc-a1:$remote_payload"

          ssh djc-a1 "sudo bash -s -- '$remote_payload'" <<'REMOTE'
          set -euo pipefail
          payload="$1"
          admin_env='/etc/devjobcollector/djc-mysql-migration.env'
          db_host='10.0.0.104'
          app_host='10.0.0.115'
          backup_dir='/var/backups/devjobcollector'

          test -s "$payload"
          test -s "$admin_env"
          source "$payload"
          source "$admin_env"
          rm -f "$payload"

          db_username="$(printf '%s' "$DB_USERNAME_B64" | base64 -d)"
          db_password="$(printf '%s' "$DB_PASSWORD_B64" | base64 -d)"
          flyway_username="$(printf '%s' "$FLYWAY_USERNAME_B64" | base64 -d)"
          flyway_password="$(printf '%s' "$FLYWAY_PASSWORD_B64" | base64 -d)"
          test "$db_username" = 'djc_app'
          test "$flyway_username" = 'djc_migrator'

          mysql_admin() {
            docker run --rm --interactive --network host \
              --env MYSQL_PWD="$DJC_MYSQL_ADMIN_PASSWORD" \
              mysql:8.4 mysql --host "$db_host" --user "$DJC_MYSQL_ADMIN_USERNAME" "$@"
          }

          install -d -m 700 "$backup_dir"
          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          backup="$backup_dir/devjob-before-flyway-$timestamp.sql.gz"
          docker run --rm --network host \
            --env MYSQL_PWD="$DJC_MYSQL_ADMIN_PASSWORD" \
            mysql:8.4 mysqldump \
              --host "$db_host" \
              --user "$DJC_MYSQL_ADMIN_USERNAME" \
              --single-transaction \
              --routines \
              --triggers \
              --no-tablespaces \
              --set-gtid-purged=OFF \
              devjob | gzip -9 > "$backup"
          test -s "$backup"
          chmod 600 "$backup"
          echo "backup_file=$(basename "$backup")"
          echo "backup_size_bytes=$(stat -c %s "$backup")"
          echo "backup_sha256=$(sha256sum "$backup" | cut -d' ' -f1)"

          mysql_admin <<SQL
          CREATE USER IF NOT EXISTS '${db_username}'@'${app_host}' IDENTIFIED BY '${db_password}';
          ALTER USER '${db_username}'@'${app_host}' IDENTIFIED BY '${db_password}';
          GRANT SELECT, INSERT, UPDATE, DELETE ON devjob.* TO '${db_username}'@'${app_host}';

          CREATE USER IF NOT EXISTS '${flyway_username}'@'${app_host}' IDENTIFIED BY '${flyway_password}';
          ALTER USER '${flyway_username}'@'${app_host}' IDENTIFIED BY '${flyway_password}';
          GRANT ALL PRIVILEGES ON devjob.* TO '${flyway_username}'@'${app_host}';
          SQL

          for account in app migrator; do
            if [ "$account" = 'app' ]; then
              username="$db_username"
              password="$db_password"
            else
              username="$flyway_username"
              password="$flyway_password"
            fi
            docker run --rm --network host \
              --env MYSQL_PWD="$password" \
              mysql:8.4 mysql \
                --host "$db_host" \
                --user "$username" \
                --batch \
                --skip-column-names \
                devjob \
                --execute "SELECT CONCAT('${account}_login=', IF(COUNT(*) >= 0, 'ok', 'fail')) FROM information_schema.tables WHERE table_schema='devjob';"
          done

          mysql_admin --batch --skip-column-names --execute "SHOW GRANTS FOR '${db_username}'@'${app_host}'; SHOW GRANTS FOR '${flyway_username}'@'${app_host}';"

          unset db_password flyway_password DJC_MYSQL_ADMIN_PASSWORD
          REMOTE

          rm -f credentials.env
