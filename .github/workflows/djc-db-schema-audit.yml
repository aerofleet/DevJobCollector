name: Audit DJC Managed MySQL Schema

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARED_VERSION: 2026.5.1
  CLOUDFLARED_SHA256: 4274f6106efbe586e8e2127aba02798c55bcfd99a45d14f08779d6afc51e8752

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install cloudflared client
        run: |
          set -euo pipefail
          package="cloudflared-linux-amd64.deb"
          curl --fail --location --retry 3 \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/${package}" \
            --output "$package"
          printf '%s  %s\n' "$CLOUDFLARED_SHA256" "$package" | sha256sum --check --strict
          sudo dpkg -i "$package"

      - name: Audit schema through Cloudflare Tunnel
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          cat > ~/.ssh/config <<EOF
          Host djc-a1
            HostName ssh-djc.itsdev.kr
            User $SERVER_USER
            IdentityFile ~/.ssh/id_rsa
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking accept-new
            BatchMode yes
          EOF
          chmod 600 ~/.ssh/config

          ssh djc-a1 'sudo bash -s' <<'REMOTE'
          set -euo pipefail

          admin_env='/etc/devjobcollector/djc-mysql-migration.env'
          test -s "$admin_env"
          source "$admin_env"
          test -n "${DJC_MYSQL_ADMIN_USERNAME:-}"
          test -n "${DJC_MYSQL_ADMIN_PASSWORD:-}"

          db_host='10.0.0.104'
          mysql_query() {
            docker run --rm --network host \
              --env MYSQL_PWD="$DJC_MYSQL_ADMIN_PASSWORD" \
              mysql:8.4 \
              mysql \
                --host "$db_host" \
                --user "$DJC_MYSQL_ADMIN_USERNAME" \
                --batch \
                --skip-column-names \
                "$@"
          }

          echo '=== schema objects ==='
          mysql_query --execute "
            SELECT TABLE_NAME, TABLE_TYPE
            FROM information_schema.tables
            WHERE table_schema = 'devjob'
            ORDER BY TABLE_TYPE, TABLE_NAME;
          "

          echo '=== columns ==='
          mysql_query --execute "
            SELECT TABLE_NAME, ORDINAL_POSITION, COLUMN_NAME, COLUMN_TYPE, IS_NULLABLE, COLUMN_DEFAULT, EXTRA
            FROM information_schema.columns
            WHERE table_schema = 'devjob'
            ORDER BY TABLE_NAME, ORDINAL_POSITION;
          "

          echo '=== constraints ==='
          mysql_query --execute "
            SELECT TABLE_NAME, CONSTRAINT_NAME, CONSTRAINT_TYPE
            FROM information_schema.table_constraints
            WHERE table_schema = 'devjob'
            ORDER BY TABLE_NAME, CONSTRAINT_NAME;
          "

          history_exists="$(mysql_query --execute "
            SELECT COUNT(*)
            FROM information_schema.tables
            WHERE table_schema = 'devjob'
              AND table_name = 'flyway_schema_history';
          ")"
          echo "flyway_history_exists=$history_exists"
          if [ "$history_exists" = '1' ]; then
            echo '=== flyway history ==='
            mysql_query devjob --execute "
              SELECT installed_rank, version, description, type, success
              FROM flyway_schema_history
              ORDER BY installed_rank;
            "
          fi

          output='/tmp/djc-schema-baseline.sql'
          docker run --rm --network host \
            --env MYSQL_PWD="$DJC_MYSQL_ADMIN_PASSWORD" \
            mysql:8.4 \
            mysqldump \
              --host "$db_host" \
              --user "$DJC_MYSQL_ADMIN_USERNAME" \
              --no-data \
              --skip-comments \
              --skip-dump-date \
              --no-tablespaces \
              --set-gtid-purged=OFF \
              --skip-add-locks \
              --skip-disable-keys \
              --skip-add-drop-table \
              devjob > "$output"

          install -o "$SUDO_USER" -g "$SUDO_USER" -m 600 \
            "$output" "/home/$SUDO_USER/djc-schema-baseline.sql"
          rm -f "$output"

          unset DJC_MYSQL_ADMIN_PASSWORD
          REMOTE

      - name: Download DJC schema baseline through Cloudflare Tunnel
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if scp "djc-a1:/home/$SERVER_USER/djc-schema-baseline.sql" ./djc-schema-baseline.sql; then
              break
            fi
            if [ "$attempt" = '3' ]; then
              exit 1
            fi
            sleep 5
          done

      - name: Upload DJC schema baseline
        uses: actions/upload-artifact@v4
        with:
          name: djc-schema-baseline
          path: djc-schema-baseline.sql
          if-no-files-found: error
          retention-days: 1
