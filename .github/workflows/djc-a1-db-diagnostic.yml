name: Diagnose DJC A1 Database Configuration

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARED_VERSION: 2026.5.1
  CLOUDFLARED_SHA256: 4274f6106efbe586e8e2127aba02798c55bcfd99a45d14f08779d6afc51e8752

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install cloudflared client
        run: |
          set -euo pipefail
          package="cloudflared-linux-amd64.deb"
          curl --fail --location --retry 3 \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/${package}" \
            --output "$package"
          printf '%s  %s\n' "$CLOUDFLARED_SHA256" "$package" | sha256sum --check --strict
          sudo dpkg -i "$package"

      - name: Compare active and deployment database configuration
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          cat > ~/.ssh/config <<EOF
          Host djc-a1
            HostName ssh-djc.itsdev.kr
            User $SERVER_USER
            IdentityFile ~/.ssh/id_rsa
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking accept-new
            BatchMode yes
          EOF
          chmod 600 ~/.ssh/config

          ssh djc-a1 'sudo bash -s' <<'REMOTE'
          set -euo pipefail

          container_id="$(
            docker ps \
              --filter 'label=com.docker.compose.project=devjobcollector' \
              --filter 'label=com.docker.compose.service=app' \
              --quiet \
              | head -n 1
          )"
          test -n "$container_id"

          container_env="$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$container_id")"
          legacy_url="$(printf '%s\n' "$container_env" | sed -n 's/^SPRING_DATASOURCE_URL=//p' | tail -n 1)"
          legacy_user="$(printf '%s\n' "$container_env" | sed -n 's/^SPRING_DATASOURCE_USERNAME=//p' | tail -n 1)"
          legacy_password="$(printf '%s\n' "$container_env" | sed -n 's/^SPRING_DATASOURCE_PASSWORD=//p' | tail -n 1)"
          if [ -z "$legacy_password" ]; then
            legacy_password="$(printf '%s\n' "$container_env" | sed -n 's/^DB_PASSWORD=//p' | tail -n 1)"
          fi

          deployment_env='/etc/devjobcollector/devjobcollector.env'
          test -s "$deployment_env"
          current_url="$(sed -n 's/^SPRING_DATASOURCE_URL=//p' "$deployment_env" | tail -n 1)"
          current_user="$(sed -n 's/^SPRING_DATASOURCE_USERNAME=//p' "$deployment_env" | tail -n 1)"
          current_password="$(sed -n 's/^SPRING_DATASOURCE_PASSWORD=//p' "$deployment_env" | tail -n 1)"

          test -n "$legacy_url"
          test -n "$legacy_user"
          test -n "$legacy_password"
          test -n "$current_url"
          test -n "$current_user"
          test -n "$current_password"

          [ "$legacy_url" = "$current_url" ] && url_match=true || url_match=false
          [ "$legacy_user" = "$current_user" ] && user_match=true || user_match=false
          [ "$legacy_password" = "$current_password" ] && password_match=true || password_match=false
          [ "$legacy_user" = 'djcadmin' ] && legacy_user_is_djcadmin=true || legacy_user_is_djcadmin=false
          [ "$current_user" = 'djcadmin' ] && current_user_is_djcadmin=true || current_user_is_djcadmin=false

          echo "database_url_match=$url_match"
          echo "database_user_match=$user_match"
          echo "database_password_match=$password_match"
          echo "legacy_user_is_djcadmin=$legacy_user_is_djcadmin"
          echo "deployment_user_is_djcadmin=$current_user_is_djcadmin"

          db_endpoint="${legacy_url#jdbc:mysql://}"
          db_host_port="${db_endpoint%%/*}"
          db_host="${db_host_port%%:*}"
          db_port="${db_host_port##*:}"

          account_summary="$(
            docker run --rm --network host \
              --env MYSQL_PWD="$legacy_password" \
              mysql:8.4 \
              mysql \
                --host "$db_host" \
                --port "$db_port" \
                --user "$legacy_user" \
                --batch \
                --skip-column-names \
                --execute "
                  SET @client_host = (
                    SELECT SUBSTRING_INDEX(HOST, ':', 1)
                    FROM information_schema.processlist
                    WHERE ID = CONNECTION_ID()
                  );
                  SELECT CONCAT('djcadmin_account_count=', COUNT(*))
                  FROM mysql.user
                  WHERE User = 'djcadmin';
                  SELECT CONCAT(
                    'djcadmin_matching_host_count=',
                    SUM(CASE WHEN Host = '%' OR Host = @client_host THEN 1 ELSE 0 END)
                  )
                  FROM mysql.user
                  WHERE User = 'djcadmin';
                "
          )"
          printf '%s\n' "$account_summary"

          curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health \
            | grep -q '"status":"UP"'
          echo 'legacy_health=UP'
          REMOTE
