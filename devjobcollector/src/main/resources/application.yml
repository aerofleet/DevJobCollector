# src/main/resources/application.yml

spring:
  application:
    name: devjobcollector
    
  profiles:
    active: local
    
  jpa:
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true
        "[dialect]": org.hibernate.dialect.MySQLDialect
        "[session.events.log.LOG_QUERIES_SLOWER_THAN_MS]": 50
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLED:true}
  flyway:
    enabled: true
    baseline-on-migrate: true
    # 기존 운영 DB의 DJC 핵심 8개 테이블은 V1 기준선과 동일하다.
    baseline-version: 1
    user: ${FLYWAY_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
    password: ${FLYWAY_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}}

management:
  health:
    mail:
      enabled: ${AUTH_SIGNUP_MAIL_ENABLED:false}
perf:
  log:
    request-threshold-ms: 80
    service-threshold-ms: 60
    repository-threshold-ms: 40

logging:
  level:
    "[kr.itsdev.devjobcollector.monitoring]": INFO
    "[org.hibernate.SQL_SLOW]": INFO
        
data-api:
  public-data:
    base-url: https://apis.data.go.kr/1051000/recruitment
    service-key: ${API_SERVICE_KEY}

collection:
  company-page:
    user-agent: ${COMPANY_PAGE_USER_AGENT:DevJobCollector/1.0 (+https://itsdev.kr)}
    max-description-length: ${COMPANY_PAGE_MAX_DESCRIPTION_LENGTH:20000}
  saramin:
    enabled: ${SARAMIN_COLLECTION_ENABLED:false}
    access-key: ${SARAMIN_ACCESS_KEY:}
    page-size: ${SARAMIN_PAGE_SIZE:110}
    max-pages: ${SARAMIN_MAX_PAGES:10}
  ats:
    enabled: ${ATS_COLLECTION_ENABLED:true}
    initial-delay-ms: ${ATS_COLLECTION_INITIAL_DELAY_MS:30000}
    poll-delay-ms: ${ATS_COLLECTION_POLL_DELAY_MS:600000}
    closure-miss-threshold: ${ATS_COLLECTION_CLOSURE_MISS_THRESHOLD:2}
    targets:
      - enabled: true
        company-name: GitLab
        provider: GREENHOUSE
        source-identifier: gitlab
        careers-url: https://about.gitlab.com/jobs
        collection-tier: A
      - enabled: true
        company-name: Integrate
        provider: LEVER
        source-identifier: integrate
        careers-url: https://jobs.lever.co/integrate
        collection-tier: A
      - enabled: ${SARAMIN_COLLECTION_ENABLED:false}
        company-name: 사람인 IT개발·데이터
        provider: SARAMIN
        source-identifier: "22"
        careers-url: https://www.saramin.co.kr/zf_user/jobs/list/job-category
        collection-tier: B
      - enabled: ${TOSS_COLLECTION_ENABLED:false}
        company-name: 토스 커뮤니티
        provider: TOSS_CAREERS
        source-identifier: toss
        careers-url: https://toss.im/career
        collection-tier: B
      - enabled: ${NAVER_COLLECTION_ENABLED:true}
        company-name: 네이버 계열사
        provider: NAVER_CAREERS
        source-identifier: naver-careers
        careers-url: https://recruit.navercorp.com/rcrt/list.do
        collection-tier: B

server:
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  compression:
    enabled: true

auth:
  common:
    frontend-success-uri: ${AUTH_FRONTEND_SUCCESS_URI:http://localhost:5173/oauth/callback}
    frontend-failure-uri: ${AUTH_FRONTEND_FAILURE_URI:${AUTH_FRONTEND_SUCCESS_URI:http://localhost:5173/oauth/callback}}
    token-query-param: token
    oauth-state-ttl: ${AUTH_OAUTH_STATE_TTL:5m}
    oauth-state-max-pending: ${AUTH_OAUTH_STATE_MAX_PENDING:8}
  token:
    issuer: ${AUTH_TOKEN_ISSUER:devjobcollector}
    secret: ${AUTH_TOKEN_SECRET:change-this-secret-at-least-32chars}
    expires-minutes: ${AUTH_TOKEN_EXPIRES_MINUTES:120}
  local-login:
    enabled: ${AUTH_LOCAL_LOGIN_ENABLED:false}
    users: []
  signup:
    verification-minutes: ${AUTH_SIGNUP_VERIFICATION_MINUTES:15}
    max-verification-attempts: ${AUTH_SIGNUP_MAX_VERIFICATION_ATTEMPTS:5}
    requests-per-hour: ${AUTH_SIGNUP_REQUESTS_PER_HOUR:5}
    mail-delivery-enabled: ${AUTH_SIGNUP_MAIL_ENABLED:false}
    expose-code-in-response: ${AUTH_SIGNUP_EXPOSE_CODE:false}
    mail-from: ${AUTH_SIGNUP_MAIL_FROM:no-reply@devjobs.local}
    turnstile-enabled: ${AUTH_SIGNUP_TURNSTILE_ENABLED:false}
    turnstile-secret: ${TURNSTILE_SECRET_KEY:}
    terms-policy-version: ${AUTH_SIGNUP_TERMS_POLICY_VERSION:v1}
    privacy-policy-version: ${AUTH_SIGNUP_PRIVACY_POLICY_VERSION:v1}

security:
  hardening:
    window-minutes: ${SECURITY_RATE_LIMIT_WINDOW_MINUTES:60}
    max-tracked-keys: ${SECURITY_RATE_LIMIT_MAX_TRACKED_KEYS:10000}
    company-signups-per-window: ${SECURITY_COMPANY_SIGNUPS_PER_WINDOW:5}
    member-invitations-per-window: ${SECURITY_MEMBER_INVITATIONS_PER_WINDOW:30}
    verification-requests-per-window: ${SECURITY_VERIFICATION_REQUESTS_PER_WINDOW:5}
    verification-reviews-per-window: ${SECURITY_VERIFICATION_REVIEWS_PER_WINDOW:60}

admin:
  security:
    session-cookie-name: ${ADMIN_SESSION_COOKIE_NAME:DJC_ADMIN_SESSION}
    csrf-cookie-name: ${ADMIN_CSRF_COOKIE_NAME:DJC_ADMIN_CSRF}
    csrf-header-name: ${ADMIN_CSRF_HEADER_NAME:X-CSRF-TOKEN}
    cookie-domain: ${ADMIN_COOKIE_DOMAIN:.itsdev.kr}
    secure-cookies: ${ADMIN_SECURE_COOKIES:true}
    session-duration: ${ADMIN_SESSION_DURATION:8h}
    maximum-failed-attempts: ${ADMIN_MAX_FAILED_ATTEMPTS:5}
    lock-duration: ${ADMIN_LOCK_DURATION:30m}
    mfa-encryption-key: ${ADMIN_MFA_ENCRYPTION_KEY:}
    allowed-origins: ${ADMIN_ALLOWED_ORIGINS:https://djc-admin.itsdev.kr,http://localhost:5174}
  bootstrap:
    enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
    email: ${ADMIN_BOOTSTRAP_EMAIL:}
    name: ${ADMIN_BOOTSTRAP_NAME:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
    password-file: ${ADMIN_BOOTSTRAP_PASSWORD_FILE:}
    mfa-secret: ${ADMIN_BOOTSTRAP_MFA_SECRET:}
